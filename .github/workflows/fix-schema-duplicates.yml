name: Fix schema duplicate keys

on:
  push:
    paths:
      - ".github/workflows/fix-schema-duplicates.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply schema cleanup
        run: python .github/schema-fix.py
      - name: Commit schema cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(tr)/sahne-kiralama/page.js" "app/(tr)/ses-isik-sistemleri/page.js" "app/en/stage-rental/page.js"
          git commit -m "Remove duplicate Service schema keys"
          git push origin HEAD:main
